<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordLoop · 单词背诵</title>
  <style>
    :root {
      --ink: #1f2942;
      --muted: #7d8498;
      --purple: #7467e8;
      --purple-dark: #5e51d2;
      --purple-light: #eeeafd;
      --green: #23a875;
      --red: #e45d69;
      --line: #e8e7f1;
      --background: #eeecfa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 17%, rgba(255, 255, 255, .9) 0 4px, transparent 5px),
        radial-gradient(circle at 83% 79%, rgba(255, 255, 255, .75) 0 6px, transparent 7px),
        linear-gradient(145deg, #e9e6fa 0%, #f7f5fc 54%, #e9eaf9 100%);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      content: "";
      filter: blur(5px);
    }

    body::before {
      top: -190px;
      left: -140px;
      background: rgba(152, 132, 240, .18);
    }

    body::after {
      right: -180px;
      bottom: -220px;
      background: rgba(113, 186, 223, .17);
    }

    .app {
      width: min(92vw, 660px);
      padding: 38px 42px 34px;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 28px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 24px 70px rgba(83, 72, 140, .15), 0 3px 12px rgba(76, 66, 120, .06);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 42px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 750;
      letter-spacing: .02em;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      background: var(--purple);
      color: white;
      box-shadow: 0 8px 20px rgba(116, 103, 232, .25);
      font-family: Georgia, serif;
      font-size: 23px;
      font-style: italic;
    }

    .counter {
      padding: 8px 13px;
      border-radius: 999px;
      background: #f4f2fb;
      color: #74788b;
      font-size: 13px;
      font-weight: 650;
    }

    .prompt-area {
      min-height: 145px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--purple);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .16em;
    }

    .word {
      max-width: 100%;
      margin: 0;
      overflow-wrap: anywhere;
      font-family: Georgia, "Times New Roman", "Microsoft YaHei", serif;
      font-size: clamp(36px, 7vw, 56px);
      font-weight: 650;
      line-height: 1.18;
      letter-spacing: -.02em;
    }

    .word.is-empty {
      color: #a4a4b4;
      font-family: inherit;
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 650;
      letter-spacing: 0;
    }

    .part-of-speech {
      margin-top: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--purple-light);
      color: var(--purple-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      font-weight: 700;
    }

    .part-of-speech[hidden] {
      display: none;
    }

    .hint {
      min-height: 22px;
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .answer-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 28px;
    }

    .answer-input {
      width: 100%;
      min-width: 0;
      height: 52px;
      padding: 0 18px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: #fbfbfd;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .answer-input::placeholder {
      color: #aaadbb;
    }

    .answer-input:focus {
      border-color: var(--purple);
      background: white;
      box-shadow: 0 0 0 4px rgba(116, 103, 232, .11);
    }

    /* 兼容仍支持 ime-mode 的旧式浏览器；现代浏览器使用脚本设置的语言与键盘提示。 */
    .answer-input.expect-english {
      ime-mode: disabled;
    }

    .answer-input.expect-chinese {
      ime-mode: active;
    }

    .answer-input.correct {
      border-color: var(--green);
      background: #f6fffb;
      box-shadow: 0 0 0 4px rgba(35, 168, 117, .09);
    }

    .answer-input.wrong {
      border-color: var(--red);
      background: #fff9fa;
      box-shadow: 0 0 0 4px rgba(228, 93, 105, .09);
    }

    button {
      border: 0;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, background .15s, opacity .15s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 3px solid rgba(116, 103, 232, .24);
      outline-offset: 2px;
    }

    button:disabled,
    input:disabled {
      cursor: not-allowed;
      opacity: .48;
    }

    .confirm-button {
      min-width: 92px;
      padding: 0 22px;
      border-radius: 14px;
      background: var(--purple);
      color: white;
      box-shadow: 0 8px 18px rgba(116, 103, 232, .22);
    }

    .confirm-button:hover:not(:disabled) {
      background: var(--purple-dark);
      box-shadow: 0 10px 23px rgba(116, 103, 232, .28);
    }

    .feedback {
      min-height: 24px;
      margin: 12px 3px 4px;
      font-size: 14px;
      font-weight: 650;
    }

    .feedback.success {
      color: var(--green);
    }

    .feedback.error {
      color: var(--red);
    }

    .divider {
      height: 1px;
      margin: 24px 0;
      background: var(--line);
    }

    .actions {
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr;
      gap: 11px;
    }

    .secondary-button {
      min-height: 46px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      color: #62687a;
    }

    .secondary-button:hover:not(:disabled) {
      border-color: #d7d3ee;
      background: #f8f7fd;
      color: var(--purple-dark);
    }

    .import-button {
      border-color: transparent;
      background: var(--purple-light);
      color: var(--purple-dark);
    }

    .file-note {
      margin: 18px 0 0;
      color: #989bab;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .file-note code {
      padding: 2px 6px;
      border-radius: 5px;
      background: #f4f2f9;
      color: #747085;
      font-family: Consolas, monospace;
    }

    #fileInput {
      display: none;
    }

    .results-overlay[hidden] {
      display: none;
    }

    .results-overlay {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      padding: 20px;
      place-items: center;
      background: rgba(31, 27, 56, .45);
      backdrop-filter: blur(7px);
    }

    .results-card {
      width: min(92vw, 470px);
      padding: 34px;
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 24px;
      background: white;
      box-shadow: 0 26px 80px rgba(35, 27, 76, .26);
      text-align: center;
    }

    .results-icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 17px;
      place-items: center;
      border-radius: 18px;
      background: var(--purple-light);
      color: var(--purple);
      font-size: 27px;
      font-weight: 800;
    }

    .results-title {
      margin: 0;
      font-size: 26px;
    }

    .results-subtitle {
      margin: 9px 0 25px;
      color: var(--muted);
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      padding: 17px 8px 15px;
      border-radius: 15px;
      background: #f7f6fb;
    }

    .stat-value {
      display: block;
      margin-bottom: 5px;
      color: var(--purple-dark);
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .stat-label {
      color: #85889a;
      font-size: 12px;
      font-weight: 650;
    }

    .results-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 25px;
    }

    .results-actions button {
      min-height: 46px;
      border-radius: 13px;
    }

    .close-results-button {
      border: 1px solid var(--line);
      background: white;
      color: #6d7182;
    }

    .restart-button {
      background: var(--purple);
      color: white;
      box-shadow: 0 8px 18px rgba(116, 103, 232, .22);
    }

    @media (max-width: 560px) {
      .app {
        width: min(94vw, 660px);
        padding: 28px 22px 24px;
        border-radius: 23px;
      }

      .topbar {
        margin-bottom: 30px;
      }

      .answer-row {
        grid-template-columns: 1fr;
      }

      .confirm-button {
        height: 48px;
      }

      .actions {
        grid-template-columns: 1fr 1fr;
      }

      .import-button {
        grid-column: 1 / -1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="pageTitle">
    <div class="topbar">
      <div class="brand" id="pageTitle">
        <span class="brand-mark">W</span>
        <span>WordLoop</span>
      </div>
      <div class="counter" id="counter" aria-live="polite">尚未导入词库</div>
    </div>

    <section class="prompt-area" aria-live="polite">
      <p class="eyebrow" id="directionLabel">准备开始</p>
      <h1 class="word is-empty" id="wordDisplay">导入词库开始练习</h1>
      <span class="part-of-speech" id="partOfSpeech" hidden></span>
      <p class="hint" id="hint">系统会随机显示中文或英文</p>
    </section>

    <form id="answerForm" autocomplete="off">
      <div class="answer-row">
        <input
          class="answer-input"
          id="answerInput"
          type="text"
          placeholder="请先导入 TXT 词库"
          aria-label="输入答案"
          disabled
        >
        <button class="confirm-button" id="confirmButton" type="submit" disabled>确定</button>
      </div>
    </form>
    <p class="feedback" id="feedback" aria-live="assertive"></p>

    <div class="divider"></div>

    <div class="actions">
      <button class="secondary-button import-button" id="importButton" type="button">＋ 导入词库</button>
      <button class="secondary-button" id="previousButton" type="button" disabled>← 上一个</button>
      <button class="secondary-button" id="nextButton" type="button" disabled>下一个 →</button>
    </div>

    <p class="file-note">每行格式：<code>apple 苹果 n.</code>（第三列词性可选）</p>
    <input id="fileInput" type="file" accept=".txt,text/plain">
  </main>

  <div class="results-overlay" id="resultsModal" role="dialog" aria-modal="true" aria-labelledby="resultsTitle" hidden>
    <section class="results-card">
      <div class="results-icon" aria-hidden="true">✓</div>
      <h2 class="results-title" id="resultsTitle">本轮练习完成</h2>
      <p class="results-subtitle">做得不错，来看一下本轮的学习统计吧</p>

      <div class="stats">
        <div class="stat">
          <strong class="stat-value" id="errorCount">0</strong>
          <span class="stat-label">错误次数</span>
        </div>
        <div class="stat">
          <strong class="stat-value" id="hintCount">0</strong>
          <span class="stat-label">提示次数</span>
        </div>
        <div class="stat">
          <strong class="stat-value" id="totalCount">0</strong>
          <span class="stat-label">总单词数</span>
        </div>
      </div>

      <div class="results-actions">
        <button class="close-results-button" id="closeResultsButton" type="button">返回检查</button>
        <button class="restart-button" id="restartButton" type="button">再练一轮</button>
      </div>
    </section>
  </div>

  <script>
    (() => {
      "use strict";

      const elements = {
        answerForm: document.querySelector("#answerForm"),
        answerInput: document.querySelector("#answerInput"),
        closeResultsButton: document.querySelector("#closeResultsButton"),
        confirmButton: document.querySelector("#confirmButton"),
        counter: document.querySelector("#counter"),
        directionLabel: document.querySelector("#directionLabel"),
        errorCount: document.querySelector("#errorCount"),
        feedback: document.querySelector("#feedback"),
        fileInput: document.querySelector("#fileInput"),
        hint: document.querySelector("#hint"),
        hintCount: document.querySelector("#hintCount"),
        importButton: document.querySelector("#importButton"),
        nextButton: document.querySelector("#nextButton"),
        partOfSpeech: document.querySelector("#partOfSpeech"),
        previousButton: document.querySelector("#previousButton"),
        restartButton: document.querySelector("#restartButton"),
        resultsModal: document.querySelector("#resultsModal"),
        totalCount: document.querySelector("#totalCount"),
        wordDisplay: document.querySelector("#wordDisplay")
      };

      let vocabulary = [];
      let practiceCards = [];
      let currentIndex = -1;
      let sessionStats = { errors: 0, hints: 0 };
      let canAdvanceWithEnter = false;

      function shuffle(items) {
        const result = [...items];
        for (let index = result.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [result[index], result[randomIndex]] = [result[randomIndex], result[index]];
        }
        return result;
      }

      function makePracticeRound() {
        let randomized = shuffle(vocabulary);

        if (
          practiceCards.length > 0 &&
          randomized.length > 1 &&
          practiceCards.at(-1).entry.id === randomized[0].id
        ) {
          [randomized[0], randomized[1]] = [randomized[1], randomized[0]];
        }

        return randomized.map((entry) => ({
          entry,
          promptLanguage: Math.random() < 0.5 ? "english" : "chinese",
          wrongAttempts: 0,
          answerRevealed: false
        }));
      }

      function resetFeedback() {
        elements.feedback.textContent = "";
        elements.feedback.className = "feedback";
        elements.answerInput.classList.remove("correct", "wrong");
      }

      function configureInputLanguage(needsEnglish) {
        elements.answerInput.classList.toggle("expect-english", needsEnglish);
        elements.answerInput.classList.toggle("expect-chinese", !needsEnglish);
        elements.answerInput.setAttribute("lang", needsEnglish ? "en" : "zh-CN");
        elements.answerInput.setAttribute("inputmode", needsEnglish ? "email" : "text");
        elements.answerInput.setAttribute("autocapitalize", needsEnglish ? "none" : "sentences");
        elements.answerInput.setAttribute("aria-label", needsEnglish ? "输入英文答案" : "输入中文答案");
        elements.answerInput.title = needsEnglish ? "当前需要英文输入" : "当前需要中文输入";
        elements.answerInput.spellcheck = false;
      }

      function renderCard() {
        if (currentIndex < 0 || !practiceCards[currentIndex]) return;

        const card = practiceCards[currentIndex];
        const showEnglish = card.promptLanguage === "english";
        const needsEnglish = !showEnglish;

        elements.wordDisplay.textContent = showEnglish ? card.entry.english : card.entry.chinese;
        elements.wordDisplay.classList.remove("is-empty");
        elements.directionLabel.textContent = showEnglish ? "英译中" : "中译英";
        elements.hint.textContent = showEnglish ? "请输入对应的中文意思" : "请输入对应的英文单词";
        elements.answerInput.placeholder = showEnglish ? "输入中文意思" : "输入英文单词";
        elements.partOfSpeech.textContent = card.entry.partOfSpeech;
        elements.partOfSpeech.hidden = !card.entry.partOfSpeech || card.entry.partOfSpeech === "-";
        configureInputLanguage(needsEnglish);
        elements.answerInput.value = "";
        elements.counter.textContent = `第 ${currentIndex + 1} 题 · 共 ${vocabulary.length} 个词`;
        elements.previousButton.disabled = currentIndex === 0;
        elements.nextButton.disabled = false;
        canAdvanceWithEnter = false;
        resetFeedback();
        elements.answerInput.focus();
      }

      function normalizeAnswer(value, isEnglish) {
        const normalized = value.trim().replace(/\s+/g, " ");
        if (isEnglish) {
          return normalized
            .replace(/\s*-\s*/g, "-")
            .replace(/\s+/g, "-")
            .toLocaleLowerCase("en");
        }
        return normalized.replace(/;/g, "；");
      }

      function checkAnswer() {
        if (currentIndex < 0) return;

        const userAnswer = elements.answerInput.value;
        if (!userAnswer.trim()) {
          elements.feedback.textContent = "请先输入答案";
          elements.feedback.className = "feedback error";
          elements.answerInput.classList.add("wrong");
          elements.answerInput.focus();
          return;
        }

        const card = practiceCards[currentIndex];
        const needsEnglish = card.promptLanguage === "chinese";
        const correctAnswer = needsEnglish ? card.entry.english : card.entry.chinese;
        const chineseMeanings = card.entry.chinese
          .split(/[;；]/)
          .map((meaning) => meaning.trim())
          .filter(Boolean);
        const acceptedAnswers = needsEnglish
          ? [card.entry.english]
          : [...new Set([card.entry.chinese, ...chineseMeanings])];
        const isCorrect = acceptedAnswers.some(
          (answer) => normalizeAnswer(userAnswer, needsEnglish) === normalizeAnswer(answer, needsEnglish)
        );

        elements.answerInput.classList.toggle("correct", isCorrect);
        elements.answerInput.classList.toggle("wrong", !isCorrect);
        elements.feedback.className = isCorrect ? "feedback success" : "feedback error";

        if (isCorrect) {
          canAdvanceWithEnter = true;
          elements.feedback.textContent = !needsEnglish && chineseMeanings.length > 1
            ? `回答正确！全部中文意思：${card.entry.chinese}；按 Enter 进入下一题`
            : "回答正确，很棒！按 Enter 进入下一题";
          return;
        }

        card.wrongAttempts += 1;
        sessionStats.errors += 1;

        if (card.wrongAttempts >= 3) {
          if (!card.answerRevealed) {
            card.answerRevealed = true;
            sessionStats.hints += 1;
          }
          canAdvanceWithEnter = true;
          elements.feedback.textContent = `回答错误，已错误 ${card.wrongAttempts} 次。正确答案：${correctAnswer}；按 Enter 进入下一题`;
        } else {
          elements.feedback.textContent = `回答错误，请再试试（${card.wrongAttempts}/3）`;
        }
      }

      function showResults() {
        elements.errorCount.textContent = sessionStats.errors;
        elements.hintCount.textContent = sessionStats.hints;
        elements.totalCount.textContent = vocabulary.length;
        elements.resultsModal.hidden = false;
        elements.restartButton.focus();
      }

      function closeResults() {
        elements.resultsModal.hidden = true;
        elements.answerInput.focus();
      }

      function restartPractice() {
        elements.resultsModal.hidden = true;
        practiceCards = [];
        currentIndex = -1;
        sessionStats = { errors: 0, hints: 0 };
        goToNext();
      }

      function goToNext() {
        if (!vocabulary.length) return;

        if (currentIndex === -1) {
          practiceCards = makePracticeRound();
          currentIndex = 0;
          renderCard();
          return;
        }

        if (currentIndex >= practiceCards.length - 1) {
          showResults();
          return;
        }

        currentIndex += 1;
        renderCard();
      }

      function goToPrevious() {
        if (currentIndex <= 0) return;
        currentIndex -= 1;
        renderCard();
      }

      function parseVocabulary(text) {
        const entries = [];
        const invalidLines = [];

        text.replace(/^\uFEFF/, "").split(/\r?\n/).forEach((rawLine, index) => {
          const line = rawLine.trim();
          if (!line) return;

          const match = line.match(/^(\S+)\s+(.+)$/);
          if (!match) {
            invalidLines.push(index + 1);
            return;
          }

          const details = match[2].trim();
          const partOfSpeechPattern = "(?:adj|adv|prep|conj|pron|num|art|phr|vt|vi|n|v)\\.";
          const thirdColumn = details.match(new RegExp(`^(.+?)\\s+((?:${partOfSpeechPattern})(?:/${partOfSpeechPattern})*|-)$`, "i"));
          const chinese = thirdColumn ? thirdColumn[1].trim() : details;
          const partOfSpeech = thirdColumn ? thirdColumn[2] : "";

          entries.push({
            id: `${index}-${match[1]}-${chinese}`,
            english: match[1].trim(),
            chinese,
            partOfSpeech
          });
        });

        return { entries, invalidLines };
      }

      function decodeTextFile(buffer) {
        try {
          return new TextDecoder("utf-8", { fatal: true }).decode(buffer);
        } catch (error) {
          try {
            return new TextDecoder("gb18030").decode(buffer);
          } catch (fallbackError) {
            return new TextDecoder().decode(buffer);
          }
        }
      }

      async function importVocabulary(file) {
        if (!file) return;

        if (!file.name.toLowerCase().endsWith(".txt")) {
          elements.feedback.textContent = "请选择 TXT 格式的词库文件";
          elements.feedback.className = "feedback error";
          return;
        }

        try {
          const buffer = await file.arrayBuffer();
          const { entries, invalidLines } = parseVocabulary(decodeTextFile(buffer));

          if (!entries.length) {
            elements.feedback.textContent = "没有读取到有效单词，请检查每行是否为“英文 中文 词性”";
            elements.feedback.className = "feedback error";
            return;
          }

          vocabulary = entries;
          practiceCards = [];
          currentIndex = -1;
          sessionStats = { errors: 0, hints: 0 };
          elements.resultsModal.hidden = true;
          elements.answerInput.disabled = false;
          elements.confirmButton.disabled = false;
          elements.nextButton.disabled = false;

          goToNext();

          if (invalidLines.length) {
            const preview = invalidLines.slice(0, 5).join("、");
            elements.feedback.textContent = `已导入 ${entries.length} 个词；第 ${preview}${invalidLines.length > 5 ? " 等" : ""} 行格式不正确，已跳过`;
            elements.feedback.className = "feedback error";
          } else {
            elements.feedback.textContent = `已从 ${file.name} 导入 ${entries.length} 个词`;
            elements.feedback.className = "feedback success";
          }
        } catch (error) {
          elements.feedback.textContent = "文件读取失败，请重新选择词库";
          elements.feedback.className = "feedback error";
        } finally {
          elements.fileInput.value = "";
        }
      }

      elements.importButton.addEventListener("click", () => elements.fileInput.click());
      elements.fileInput.addEventListener("change", (event) => importVocabulary(event.target.files[0]));
      elements.answerForm.addEventListener("submit", (event) => {
        event.preventDefault();
        checkAnswer();
      });
      elements.answerInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.isComposing && canAdvanceWithEnter) {
          event.preventDefault();
          goToNext();
        }
      });
      elements.previousButton.addEventListener("click", goToPrevious);
      elements.nextButton.addEventListener("click", goToNext);
      elements.closeResultsButton.addEventListener("click", closeResults);
      elements.restartButton.addEventListener("click", restartPractice);
      elements.resultsModal.addEventListener("click", (event) => {
        if (event.target === elements.resultsModal) closeResults();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !elements.resultsModal.hidden) closeResults();
      });
    })();
  </script>
</body>
</html>
